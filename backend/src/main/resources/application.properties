server.port=${SERVER_PORT:8080}

tai.alpaca.api-key=${ALPACA_API_KEY:}
tai.alpaca.secret-key=${ALPACA_SECRET_KEY:}
tai.alpaca.data-base-url=${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
tai.alpaca.trading-base-url=${ALPACA_TRADING_BASE_URL:https://paper-api.alpaca.markets}

tai.finnhub.api-key=${FINNHUB_API_KEY:}
tai.finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
tai.universe.stock-top-n=${UNIVERSE_STOCK_TOP_N:130}
tai.universe.crypto-top-n=${UNIVERSE_CRYPTO_TOP_N:30}
tai.universe.refresh-cron=${UNIVERSE_REFRESH_CRON:0 0 6 * * *}

tai.detection.scan-interval-ms=${DETECTION_SCAN_INTERVAL_MS:180000}
tai.detection.initial-delay-ms=${DETECTION_INITIAL_DELAY_MS:60000}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-20b}

spring.data.mongodb.uri=${MONGODB_URI:}

tai.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
tai.telegram.chat-id=${TELEGRAM_CHAT_ID:}
tai.telegram.poll-interval-ms=${TELEGRAM_POLL_INTERVAL_MS:5000}

# TAI-17: usuario único + JWT
tai.auth.username=${TAI_AUTH_USERNAME:}
tai.auth.password-hash=${TAI_AUTH_PASSWORD_HASH:}
tai.jwt.secret=${TAI_JWT_SECRET:}
tai.jwt.expiration-ms=${TAI_JWT_EXPIRATION_MS:86400000}
tai.cors.allowed-origins=${TAI_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.root=WARN
logging.level.com.tai.assistant=INFO
