services:
  - type: web
    name: trading-assistant-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: SERVER_PORT
        value: $PORT

      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets

      - key: FINNHUB_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b

      - key: MONGODB_URI
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      - key: TAI_AUTH_USERNAME
        sync: false
      - key: TAI_AUTH_PASSWORD_HASH
        sync: false
      - key: TAI_JWT_SECRET
        generateValue: true

      - key: TAI_CORS_ALLOWED_ORIGINS
        sync: false

      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
