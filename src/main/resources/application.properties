# A diferencia del spike (TAI-5), esta app sí levanta servidor web —
# la idea es poder probar los endpoints de /market y /trading mientras
# no existe el frontend (TAI-14/15) todavía.
server.port=${SERVER_PORT:8080}

tai.alpaca.api-key=${ALPACA_API_KEY:}
tai.alpaca.secret-key=${ALPACA_SECRET_KEY:}
tai.alpaca.data-base-url=${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
# Por default apunta a PAPER trading, no a la cuenta real — ver nota en AlpacaTradingClient.
tai.alpaca.trading-base-url=${ALPACA_TRADING_BASE_URL:https://paper-api.alpaca.markets}

# TAI-9: universo dinámico de activos
tai.finnhub.api-key=${FINNHUB_API_KEY:}
tai.finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
tai.universe.stock-top-n=${UNIVERSE_STOCK_TOP_N:130}
tai.universe.crypto-top-n=${UNIVERSE_CRYPTO_TOP_N:30}
# Todos los días a las 6 AM (hora del servidor), antes de la apertura del mercado de EE.UU.
tai.universe.refresh-cron=${UNIVERSE_REFRESH_CRON:0 0 6 * * *}

logging.level.root=WARN
logging.level.com.tai.assistant=INFO
